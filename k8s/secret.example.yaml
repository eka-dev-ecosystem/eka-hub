apiVersion: v1
kind: Secret
metadata:
  name: eka-hub-backend-secret
  namespace: eka-hub
  labels:
    app.kubernetes.io/name: eka-hub-backend
type: Opaque
stringData:
  # Database credentials for eka_hub_db on shared instance
  DATABASE_PASSWORD: "YOUR_DATABASE_PASSWORD"

  # Redis auth
  REDIS_PASSWORD: ""

  # JWT signing secret
  JWT_SECRET: "YOUR_SUPER_SECURE_JWT_SECRET_KEY_32_BYTES"

  # Google Gemini API key for AI Hub Briefing & Function Calling
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"

