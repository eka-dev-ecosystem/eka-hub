apiVersion: v1
kind: ConfigMap
metadata:
  name: eka-hub-backend-config
  namespace: eka-hub
  labels:
    app.kubernetes.io/name: eka-hub-backend
data:
  APP_NAME: "eka-hub-backend"
  ENVIRONMENT: "production"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "3000"
  LOG_LEVEL: "info"

  # Database settings (Shared Postgres Instance on port 54321)
  DB_HOST: "103.150.226.122"
  DB_PORT: "54321"
  DB_USER: "postgres"
  DB_NAME: "eka_hub_db"
  DB_SSLMODE: "disable"

  # Redis settings
  REDIS_HOST: "103.150.226.122"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_ENABLED: "true"

  # RabbitMQ disabled for Hub
  RABBITMQ_ENABLED: "false"

  # Realtime settings
  REALTIME_ENABLED: "true"
  REALTIME_SSE_ENABLED: "true"
  REALTIME_WS_ENABLED: "true"
  REALTIME_BRIDGE: "redis"

  # Satellite App URLs
  FTRACKER_API_BASE_URL: "https://be-ftracker.eka-dev.cloud"
  TASK_MANAGEMENT_API_BASE_URL: "https://be-task-hub.eka-dev.cloud"
