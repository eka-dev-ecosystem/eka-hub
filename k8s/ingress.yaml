apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eka-hub-backend
  namespace: eka-hub
  labels:
    app.kubernetes.io/name: eka-hub-backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hub-api.eka-dev.cloud
      secretName: eka-hub-backend-tls
  rules:
    - host: hub-api.eka-dev.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eka-hub-backend
                port:
                  number: 3000
