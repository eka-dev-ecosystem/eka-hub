apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eka-hub-backend-ingress
  namespace: eka-hub
  labels:
    app.kubernetes.io/name: eka-hub-backend
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hub-api.eka-dev.cloud
      secretName: eka-hub-tls
  rules:
    - host: hub-api.eka-dev.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eka-hub-backend
                port:
                  number: 3000

