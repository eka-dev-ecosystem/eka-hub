apiVersion: batch/v1
kind: Job
metadata:
  name: eka-hub-migration
  namespace: eka-hub
  labels:
    app.kubernetes.io/name: eka-hub-migration
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eka-hub-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/exa31/eka-hub-backend:latest
          command: ["/app/server", "-migrate-only"]
          envFrom:
            - configMapRef:
                name: eka-hub-backend-config
            - secretRef:
                name: eka-hub-backend-secret
