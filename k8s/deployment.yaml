apiVersion: apps/v1
kind: Deployment
metadata:
  name: eka-hub-backend
  namespace: eka-hub
  labels:
    app.kubernetes.io/name: eka-hub-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: eka-ecosystem
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: eka-hub-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eka-hub-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/exa31/eka-hub-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: eka-hub-backend-config
            - secretRef:
                name: eka-hub-backend-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

